<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="智慧监理移动工作台与通讯录应用入口">
  <meta name="theme-color" content="#1268e8">
  <title>智慧监理 - 移动工作台</title>
  <link rel="stylesheet" href="./css/mobile-portal.css">
</head>
<body>
  <svg class="portal-svg-sprite" aria-hidden="true">
    <symbol id="p-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H5V9"/><path d="M9 20v-6h6v6"/></symbol>
    <symbol id="p-workflow" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="12" cy="19" r="2.5"/><path d="M7.8 6.8 10.6 16M16.2 6.8 13.4 16M8.5 5h7"/></symbol>
    <symbol id="p-apps" viewBox="0 0 24 24"><path d="m12 2 8 4.5v11L12 22l-8-4.5v-11Z"/><path d="m8 9 4 2.5L16 9M12 11.5V17"/></symbol>
    <symbol id="p-message" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4Z"/><path d="M8 9h.01M12 9h.01M16 9h.01"/></symbol>
    <symbol id="p-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></symbol>
    <symbol id="p-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="p-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
    <symbol id="p-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="p-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/></symbol>
    <symbol id="p-chart" viewBox="0 0 24 24"><path d="M5 20V9M12 20V4M19 20v-7"/></symbol>
    <symbol id="p-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>

  <main class="portal-app" id="mobilePortal">
    <section id="workbenchView" class="portal-view" data-portal-view="workbench">
      <header class="workbench-masthead">
        <div class="portal-statusbar" aria-hidden="true"><time id="portalTime">09:41</time><span>●●●　Wi-Fi　▰</span></div>
        <div class="workbench-titlebar">
          <h1>智慧监理</h1>
          <div><button type="button" data-placeholder aria-label="搜索"><svg><use href="#p-search"/></svg></button><button type="button" data-placeholder aria-label="更多"><svg><use href="#p-more"/></svg></button></div>
        </div>
        <div class="workbench-banner">
          <p>高效协同<br>创造更大的价值</p>
          <span aria-hidden="true"></span>
        </div>
      </header>

      <div class="workbench-content">
        <section class="project-panel">
          <div class="panel-heading"><h2>我的项目</h2><button type="button" data-placeholder>全部项目 <svg><use href="#p-chevron"/></svg></button></div>
          <button class="project-link" type="button" data-placeholder>鄂州花湖监理项目</button>
        </section>

        <section class="summary-panel">
          <div class="panel-heading"><h2>工作概况</h2><span>本月</span></div>
          <button type="button" data-placeholder><span class="summary-icon"><svg><use href="#p-clipboard"/></svg></span><strong>待办事项</strong><b>6</b><svg class="summary-arrow"><use href="#p-chevron"/></svg></button>
          <button type="button" data-placeholder><span class="summary-icon"><svg><use href="#p-chart"/></svg></span><strong>本月完成</strong><b>12</b><svg class="summary-arrow"><use href="#p-chevron"/></svg></button>
          <button type="button" data-placeholder><span class="summary-icon"><svg><use href="#p-calendar"/></svg></span><strong>计划进行中</strong><b>4</b><svg class="summary-arrow"><use href="#p-chevron"/></svg></button>
        </section>
      </div>
    </section>

    <section id="appsView" class="portal-view apps-view" data-portal-view="apps" hidden>
      <header class="apps-header">
        <div class="portal-statusbar" aria-hidden="true"><time>09:41</time><span>●●●　Wi-Fi　▰</span></div>
        <h1>应用中心</h1>
      </header>
      <div class="apps-content">
        <section class="apps-panel" aria-labelledby="commonAppsTitle">
          <h2 id="commonAppsTitle">常用应用</h2>
          <a class="address-book-tile" href="./address-book-mobile.html">
            <img src="./assets/images/address-book-app-icon.png" alt="">
            <span>通讯录</span>
          </a>
        </section>
      </div>
    </section>

    <nav class="portal-tabs" aria-label="移动端主导航">
      <button class="portal-tab active" type="button" data-view-target="workbench"><svg><use href="#p-home"/></svg><span>工作台</span></button>
      <button class="portal-tab" type="button" data-placeholder><svg><use href="#p-workflow"/></svg><span>流程中心</span></button>
      <button class="portal-tab" type="button" data-view-target="apps"><svg><use href="#p-apps"/></svg><span>应用中心</span></button>
      <button class="portal-tab" type="button" data-placeholder><svg><use href="#p-message"/></svg><span>消息</span></button>
      <button class="portal-tab" type="button" data-placeholder><svg><use href="#p-user"/></svg><span>我的</span></button>
    </nav>
    <div id="portalToast" class="portal-toast" role="status" aria-live="polite" hidden>当前原型仅展示通讯录访问链路</div>
  </main>

  <script src="./js/mobile-portal.js"></script>
</body>
</html>
